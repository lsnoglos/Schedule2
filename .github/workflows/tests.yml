name: Validar Schedule2
on:
  push:
    branches: [main, feat/apps-script-multi-coordinacion]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y pruebas del planificador
        run: node tests/run.cjs
